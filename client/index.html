<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocuAI</title>
  </head>
  <body>
    <div id="root">
      <h1>Loading DocuAI...</h1>
      <p>If you see this, HTML is working. React should load below.</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Debug script to check if main.tsx is loading
      console.log("HTML loaded successfully");
      setTimeout(() => {
        const root = document.getElementById('root');
        if (root && root.innerHTML.includes('Loading DocuAI')) {
          console.error("React failed to load - main.tsx not executing");
        }
      }, 5000);
    </script>
  </body>
</html>
