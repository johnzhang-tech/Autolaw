<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoLaw</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: white;
      }
      .loading {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #f3f4f6;
        border-top: 4px solid #3B82F6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .error-fallback {
        display: none;
        max-width: 600px;
        margin: 0 auto;
        padding: 40px 20px;
        text-align: center;
      }
      .button {
        background-color: #3B82F6;
        color: white;
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        text-decoration: none;
        display: inline-block;
        margin: 10px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading">
        <div class="spinner"></div>
        <h2>Loading AutoLaw...</h2>
        <p>Initializing React application...</p>
      </div>
    </div>
    
    <div id="error-fallback" class="error-fallback">
      <h1>AutoLaw</h1>
      <p>The React app couldn't load due to development environment conflicts.</p>
      <p>Your server is working perfectly - this is a known Vite plugin issue.</p>
      <a href="/test.html" class="button">View Working Test Page</a>
      <a href="/api/auth/user" class="button">Test API Directly</a>
    </div>

    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      console.log("AutoLaw HTML loaded successfully");
      
      // Show fallback if React doesn't load within 8 seconds
      setTimeout(() => {
        const root = document.getElementById('root');
        const fallback = document.getElementById('error-fallback');
        
        if (root && root.innerHTML.includes('Loading AutoLaw')) {
          console.warn("React didn't load - showing fallback interface");
          root.style.display = 'none';
          fallback.style.display = 'block';
        }
      }, 8000);
      
      // Monitor for React success
      const checkReactLoaded = () => {
        const root = document.getElementById('root');
        if (root && !root.innerHTML.includes('Loading AutoLaw')) {
          console.log("React loaded successfully!");
          return true;
        }
        return false;
      };
      
      // Check every 500ms for 10 seconds
      let attempts = 0;
      const interval = setInterval(() => {
        attempts++;
        if (checkReactLoaded() || attempts > 20) {
          clearInterval(interval);
        }
      }, 500);
    </script>
  </body>
</html>
