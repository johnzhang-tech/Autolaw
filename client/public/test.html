<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuAI Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: white;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
            padding: 40px 20px;
        }
        h1 {
            color: #111827;
            margin-bottom: 20px;
        }
        p {
            color: #6b7280;
            margin-bottom: 30px;
        }
        .button {
            background-color: #3B82F6;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            display: inline-block;
        }
        .button:hover {
            background-color: #2563EB;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DocuAI is Working!</h1>
        <p>This static test page confirms the server is functioning properly.</p>
        <p>The React app issue is caused by Vite plugin conflicts that inject problematic scripts.</p>
        <a href="/" class="button">Try React App</a>
        <br><br>
        <a href="/api/auth/user" class="button">Test API</a>
    </div>
    
    <script>
        console.log("Static test page loaded successfully");
        
        // Test API connectivity
        fetch('/api/auth/user')
            .then(response => response.json())
            .then(data => {
                console.log('API test successful:', data);
                document.body.insertAdjacentHTML('beforeend', 
                    '<div style="margin-top: 20px; padding: 10px; background: #f0f9ff; border-radius: 8px;">✅ API Connection: Working</div>');
            })
            .catch(error => {
                console.error('API test failed:', error);
                document.body.insertAdjacentHTML('beforeend', 
                    '<div style="margin-top: 20px; padding: 10px; background: #fef2f2; border-radius: 8px;">❌ API Connection: Failed</div>');
            });
    </script>
</body>
</html>
