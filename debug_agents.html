<!DOCTYPE html>
<html>
<head>
    <title>Agent State Debug</title>
</head>
<body>
    <h1>Testing Agent State Management</h1>
    <div id="results"></div>
    
    <script>
        // Test sessionStorage functionality
        const testAgentState = {
            agents: {
                agent1: { src: 'test1', loaded: true, lastAccessed: Date.now() },
                agent2: { src: 'test2', loaded: false, lastAccessed: 0 },
                agent3: { src: 'test3', loaded: false, lastAccessed: 0 }
            },
            activeAgent: 'agent1'
        };
        
        // Test storage
        try {
            sessionStorage.setItem('mr-assistant-state', JSON.stringify(testAgentState));
            const retrieved = JSON.parse(sessionStorage.getItem('mr-assistant-state'));
            document.getElementById('results').innerHTML = `
                <p>✅ SessionStorage working</p>
                <p>Stored: ${JSON.stringify(testAgentState, null, 2)}</p>
                <p>Retrieved: ${JSON.stringify(retrieved, null, 2)}</p>
            `;
        } catch (e) {
            document.getElementById('results').innerHTML = `❌ SessionStorage error: ${e.message}`;
        }
    </script>
</body>
</html>
