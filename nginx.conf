# The hosts this site is served on, and which of them robots may index.
#
# Two names serve the same pages, each with its own Cloud Run domain mapping: the apex
# autolaw.ai and www.autolaw.ai. The apex used to be a 301 at the registrar aimed at a raw
# Cloud Run URL, which is why a visitor typing autolaw.ai watched the address bar turn into
# autolaw-<project>.<region>.run.app. Mapping it here replaced that forward and made deep
# links work: the registrar's forwarder only ever handled the root, so autolaw.ai/about/
# was a 404 no matter what the forward pointed at.
#
# Both of our hosts are deliberately left indexable, and serve rather than redirect. The
# pages name www.autolaw.ai in every <link rel="canonical">, and that tag is what tells a
# search engine the two are one site. Sending noindex to the apex instead would be worse
# than it sounds: a page that is both noindex and canonicalised to another URL gives
# contradictory instructions, and the noindex can carry across to the canonical target.
#
# What stays noindex is every name that is not ours — the raw autolaw-*.run.app URL, which
# is public and serves byte-identical HTML, and the hostname each `gcloud run deploy --tag`
# preview gets. Those are turned away from the index rather than redirected, because a 301
# off the run.app host would break the one thing that host is for: opening a tagged revision
# to check it before it takes traffic.
#
# $host is already lowercased by nginx and carries no port, so the bare hostnames below are
# the whole key. An add_header whose value evaluates to the empty string is dropped rather
# than sent empty, which is how our own hosts end up with no X-Robots-Tag at all.
# src/__tests__/canonical-host.test.ts holds this list to the hosts the pages declare.
map $host $robots_tag {
  default         "noindex, nofollow";
  autolaw.ai      "";
  www.autolaw.ai  "";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Directory URLs (/security -> /security/) get a 301 from the index module. Without this,
  # nginx builds that Location from its own listen port and scheme, so a visitor typing
  # autolaw.ai/security was sent to http://www.autolaw.ai:8080/security/ — the container's
  # internal port, and https downgraded to http because Cloud Run terminates TLS upstream.
  # Relative redirects let the browser resolve against the original scheme and host.
  absolute_redirect off;

  # The stock nginx.conf ships with gzip commented out, so the React chunk (151 KB) went
  # over the wire uncompressed.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  # Security headers. Declared once, at server level, and never repeated inside a location:
  # an add_header in a location block replaces every inherited add_header, so a single
  # cache header added to /assets/ would silently drop all of these for every asset.
  # Caching below uses `expires`, which is a different directive and does not interfere.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  # Cloud Run terminates TLS, but the header is still ours to send.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # Empty on the canonical host and "noindex, nofollow" everywhere else; the map above the
  # server block says why. It belongs here with the others and not in a location, for the
  # same reason they do.
  add_header X-Robots-Tag $robots_tag always;
  # What the page actually loads: its own hashed assets, the Google Fonts stylesheet and
  # font files, and — on /schedule-call/ only — the Google Calendar booking frame.
  # 'unsafe-inline' for styles is needed by React's style attributes (the confidence bar
  # width, the legend swatches); scripts stay 'self' with no inline allowance.
  # If CONTACT_ENDPOINT in src/config.ts is ever set to another origin, add it to form-action.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; frame-src https://calendar.google.com https://calendar.app.google; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

  location = /healthz {
    access_log off;
    # default_type, not add_header: `return` already emits a Content-Type from default_type
    # (application/octet-stream), so add_header produced a second, contradictory header.
    default_type text/plain;
    return 200 'ok';
  }

  # Vite content-hashes everything under /assets/, so a file at a given URL never changes.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Font files are content-stable: a given face at a given URL never changes, and a new
  # subset would ship under a new name. Same year-long cache as the hashed assets.
  location /fonts/ {
    expires 1y;
    try_files $uri =404;
  }

  # HTML is the one thing that must always be re-validated, or a visitor keeps an old
  # index.html pointing at asset hashes that no longer exist after a deploy.
  location ~ \.html$ {
    expires -1;
    try_files $uri =404;
  }

  # A multi-page static site, not a single-page app: an unknown path is a 404, not the
  # home page with a 200. The SPA fallback that used to be here made /securty/ and
  # /favicon.ico both return the home page, which search engines index as duplicates.
  location / {
    expires -1;
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
